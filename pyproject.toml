[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "get-sauce-py"
version = "0.1.0"
description = "Windows-friendly authorized-content downloader"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3"]

[project.scripts]
get-sauce = "get_sauce:main"
